<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLAR WEBSIDE</title>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
   <link rel="stylesheet" href="style.css">
   
</head> 
<body>


<form id="serviceForm">

    <div class="form-header">
        <h2>Add New projects</h2> 
        <p>Solar Admin Panel</p>
    </div>

    <input type="text" id="title" placeholder="Project Title" required>
    <input type="text" id="image" placeholder="Image Path " required>
    <textarea id="description" placeholder="Project Description" required></textarea>

<input type="text" id="image1" placeholder="Image 1 path" required>
<input type="text" id="image2" placeholder="Image 2 path" required>
<input type="text" id="image3" placeholder="Image 3 path" required>
<input type="text" id="link" placeholder="Page Link (gallary.html)" required>

    <button type="submit">Add Service</button>
    
</form>
<script src="script.js"></script>
</body>
</html>
