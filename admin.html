<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLAR WEBSIDE</title>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
   <link rel="stylesheet" href="style.css">
   
</head> 
<body>


<form id="serviceForm">
 
    <div class="form-header">
        <h2>Add New projects</h2> 
        <p>Solar Admin Panel</p>
    </div>

    <input type="text" id="title" placeholder="Project Title" required>
   <input type="file" id="image" accept="image/*" required>
    <textarea id="description" placeholder="Project Description" required></textarea>


<input type="file" id="image1" accept="image/*" required>
<input type="file" id="image2" accept="image/*" required>
<input type="file" id="image3" accept="image/*" required>
<input type="text" id="link" placeholder="Page Link (gallary.html)" required>

<select id="category" required>
    <option value="">Select Category</option>
    <option value="residential">Residential</option>
    <option value="commercial">Commercial</option>
    <option value="industrial">Industrial</option>
</select>

    <button type="submit">Add Service</button>
    
</form>
<script src="script.js"></script>
</body>
</html>
